    <input type="file" id="custom-dataset-file" accept=".csv" onchange="handleCustomDatasetUpload(this.files)">

    <select id="benchmark-dataset-select">
        <option value="custom_uploaded">custom_uploaded</option>
        <option value="yahoo-team-full_enterprise_golden">yahoo-team-full_enterprise_golden</option>

    </select>
    <input type="checkbox" id="model-flash-35" value="gemini-3.5-flash" checked>
    <input type="checkbox" id="model-pro-31" value="gemini-3.1-pro">
    <input type="checkbox" id="instruct-default" value="Default" checked>
    <input type="checkbox" id="instruct-custom" value="Custom">
