<!-- CLEAN HELP / INFO DIALOG MODAL -->
<div id="modal-help-dialog" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(5px); z-index: 99999; align-items: center; justify-content: center; padding: 2rem;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 580px; display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,0.4); overflow: hidden;">
        <!-- Header -->
        <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-card-secondary);">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span id="help-modal-icon" style="font-size: 1.35rem;">ℹ️</span>
                <h3 id="help-modal-title" style="margin: 0; font-family: var(--font-display); font-size: 1.15rem; color: var(--text-main);">Information Guide</h3>
            </div>
            <button class="btn btn-secondary" onclick="closeHelpModal()" style="padding: 0.25rem 0.55rem; font-size: 0.85rem;">✕</button>
        </div>
        <!-- Body Content -->
        <div id="help-modal-body" style="padding: 1.5rem; font-size: 0.88rem; line-height: 1.55; color: var(--text-main); max-height: 65vh; overflow-y: auto;">
            <!-- Dynamically populated -->
        </div>
        <!-- Footer -->
        <div style="padding: 0.85rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; background: var(--bg-card-secondary);">
            <button class="btn btn-primary" onclick="closeHelpModal()" style="font-size: 0.82rem; padding: 0.4rem 1.15rem;">Got It</button>
        </div>
    </div>
</div>
