<!-- Source Management & Curation Modal (Add / Replace Golden References) -->
<div id="modal-manage-sources" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 100050; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    <div class="modal-content" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; max-width: 680px; width: 92%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; animation: fadeIn 0.15s ease-out;">
        
        <!-- Modal Header -->
        <div style="padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-card-secondary);">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span id="manage-sources-icon" style="font-size: 1.25rem;">➕</span>
                <div>
                    <h3 id="manage-sources-title" style="margin: 0; font-size: 1.05rem; font-family: var(--font-display); color: var(--text-main);">Manage Golden Dataset Sources</h3>
                    <div id="manage-sources-subtitle" style="font-size: 0.75rem; color: var(--text-sub);">Review and curate authoritative benchmark references</div>
                </div>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="closeManageSourcesModal()" style="padding: 0.25rem 0.6rem; font-size: 0.85rem; border: none; background: transparent; color: var(--text-sub); cursor: pointer;">✕</button>
        </div>

        <!-- Modal Body -->
        <div style="padding: 1.25rem 1.4rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; font-size: 0.85rem;">
            
            <!-- Query & Ground Truth Summary Card -->
            <div style="background: var(--bg-card-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.85rem 1rem;">
                <div style="margin-bottom: 0.45rem;">
                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 0.5px;">User Query</span>
                    <div id="manage-sources-query" style="font-weight: 600; color: var(--text-main); margin-top: 0.15rem;">--</div>
                </div>
                <div>
                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--success-color); text-transform: uppercase; letter-spacing: 0.5px;">Ground Truth Target Answer</span>
                    <div id="manage-sources-gt" style="color: var(--text-sub); margin-top: 0.15rem; font-size: 0.82rem; line-height: 1.4;">--</div>
                </div>
            </div>

            <!-- Current Golden Reference Assessment Box -->
            <div style="background: var(--bg-card-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.85rem 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px;">Current Dataset Golden Reference</span>
                    <span id="manage-sources-gt-quality-badge" class="badge badge-pass" style="font-size: 0.7rem;">🛡️ STRONG REFERENCE</span>
                </div>
                <div id="manage-sources-current-exp" style="font-family: monospace; font-size: 0.78rem; color: var(--text-main); word-break: break-all; margin-bottom: 0.35rem;">--</div>
                <div id="manage-sources-gt-quality-reason" style="font-size: 0.75rem; color: var(--text-sub); font-style: italic; line-height: 1.35;">--</div>
            </div>

            <!-- Candidate Cited Sources Selection Section -->
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <span id="manage-sources-section-label" style="font-size: 0.74rem; font-weight: 700; color: var(--accent-primary); text-transform: uppercase; letter-spacing: 0.5px;">Verified Grounded Cited Sources</span>
                    <span style="font-size: 0.72rem; color: var(--text-sub);">Select source to apply</span>
                </div>
                <div id="manage-sources-candidates-container" style="display: flex; flex-direction: column; gap: 0.6rem;">
                    <!-- Dynamically populated candidate source rows -->
                </div>
            </div>

        </div>

        <!-- Modal Footer -->
        <div style="padding: 0.9rem 1.4rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; align-items: center; gap: 0.75rem; background: var(--bg-card-secondary);">
            <button class="btn btn-secondary" onclick="closeManageSourcesModal()" style="font-size: 0.85rem; padding: 0.45rem 0.9rem;">Cancel</button>
            <button id="btn-manage-sources-submit" class="btn btn-primary" onclick="submitSourceCurationAction()" style="font-size: 0.85rem; padding: 0.45rem 1.1rem; display: inline-flex; align-items: center; gap: 0.4rem;">
                <span id="manage-sources-btn-label">➕ Add to Golden Dataset</span>
            </button>
        </div>

    </div>
</div>
