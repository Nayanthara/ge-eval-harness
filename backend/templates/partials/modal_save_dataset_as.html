<!-- SAVE DATASET TO REPOSITORY MODAL -->
<div id="modal-save-dataset-as" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(4px); z-index: 9999; align-items: center; justify-content: center; padding: 2rem;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 520px; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.3); overflow: hidden;">
        <div style="padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-card-secondary);">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <span style="font-size: 1.25rem;">💾</span>
                <h3 style="margin: 0; font-size: 1.15rem; color: var(--text-main);">Save Dataset to Repository</h3>
            </div>
            <button onclick="closeSaveDatasetAsModal()" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-sub);">✕</button>
        </div>
        <div style="padding: 1.5rem 1.75rem;">
            <label for="save-dataset-name-input" style="font-size: 0.85rem; font-weight: 600; color: var(--text-sub); display: block; margin-bottom: 0.4rem; text-transform: uppercase;">
                Dataset Name / Identifier:
            </label>
            <input type="text" id="save-dataset-name-input" placeholder="e.g. google-team-marketing_q3_eval" style="width: 100%; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--input-border); border-radius: 8px; padding: 0.6rem 0.85rem; font-family: monospace; font-size: 0.88rem; box-sizing: border-box; outline: none; margin-bottom: 0.75rem;">
            <div style="font-size: 0.78rem; color: var(--text-sub); line-height: 1.4;">
                This will persist the currently loaded query scenarios to <code style="color: var(--code-text); background: var(--code-bg); padding: 0.1rem 0.35rem; border-radius: 4px;">backend/data/datasets/&lt;name&gt;.json</code> so it is available across all benchmarks.
            </div>
        </div>
        <div style="padding: 1rem 1.75rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 0.75rem; background: var(--bg-card-secondary);">
            <button class="btn btn-secondary" onclick="closeSaveDatasetAsModal()">Cancel</button>
            <button class="btn btn-primary" onclick="confirmSaveDatasetAs()">💾 Save to Repository</button>
        </div>
    </div>
</div>
