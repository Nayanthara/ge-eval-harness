<!-- SCREEN 4: RUN STATUS (LIVE LOGS MONITOR) -->
<div id="screen-run-status" class="screen-content">
    <header>
        <div>
            <h1>Evaluation Status</h1>
            <div class="subtitle" id="status-subtitle-id">Monitoring execution matrix logs...</div>
        </div>
        <div style="display: flex; gap: 0.65rem; align-items: center; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 0.4rem;">
                <label for="status-run-selector" style="font-size: 0.82rem; font-weight: 600; color: var(--text-sub); white-space: nowrap;">Run:</label>
                <select id="status-run-selector" onchange="onStatusRunSelected(this.value)" style="background: var(--bg-card-secondary); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.84rem; font-weight: 500; outline: none; cursor: pointer; min-width: 240px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                    <option value="" disabled>Loading runs...</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="openRunSelectorModal('status')" style="display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; padding: 0.4rem 0.75rem;">
                <span>🔍</span> <span>Browse Runs...</span>
            </button>
            <button id="btn-view-dataset-status" class="btn btn-secondary" style="display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; padding: 0.4rem 0.75rem;" onclick="viewDatasetForMonitoredRun()">📄 View Dataset</button>
            <button id="btn-view-results-status" class="btn btn-primary" style="display: none; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: #fff; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); font-weight: 600; font-size: 0.82rem; padding: 0.4rem 0.85rem;" onclick="viewResultsForMonitoredRun()">View Results 📊</button>
            <button class="btn btn-secondary" onclick="switchScreen('home')" style="font-size: 0.82rem; padding: 0.4rem 0.75rem;">Return Home</button>
        </div>
    </header>

    <run-status-monitor id="run-status-monitor"></run-status-monitor>
</div>
