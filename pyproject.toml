[project]
name = "ge-eval-harness"
version = "0.1.0"
description = "Gemini Enterprise Evaluation Harness and Studio Web GUI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.25.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-discoveryengine>=0.11.0",
    "google-cloud-secret-manager>=2.29.0",
    "google-cloud-firestore>=2.14.0",
    "google-api-python-client>=2.100.0",
    "google-cloud-aiplatform>=1.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "cachetools>=5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "config", "cli"]

[tool.hatch.build.targets.wheel.sources]
"." = "ge_eval_harness"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]
